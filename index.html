<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="qr-code-component">
      <div class="qr-code-img-wrapper">
        <img src="Image/qr-code.png" alt="QR Code" class="qr-code-img" />
      </div>

      <div class="qr-code-txt-wrapper">
        <h2 class="qr-code-component-title">
          Improve your front-end skills by building projects
        </h2>
        <p class="qr-code-component-text">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </article>
  </body>
</html>
